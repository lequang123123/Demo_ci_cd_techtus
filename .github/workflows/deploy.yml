name: Deploy React to S3 & CloudFront

on:
  push:
    branches:
      - develop

permissions:
  id-token: write  # Allow OIDC authenticate AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Init AWS credentials (OIDC, Not need access key)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::440744239899:role/TrustRoleGithub
          aws-region: ap-southeast-1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & build
        run: |
          npm install
          npm run build

      - name: Upload lên S3
        run: aws s3 sync ./build s3://s3demostaticweb222 --delete

      - name: Delete cache CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
