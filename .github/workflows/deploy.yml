name: Deploy React to S3 & CloudFront

on:
  push:
    branches:
      - develop

permissions:
  id-token: write  # Cho phép OIDC xác thực AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠 Checkout code
        uses: actions/checkout@v3

      - name: 🔑 Thiết lập AWS credentials (OIDC, không cần access key)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::440744239899:role/TrustRoleGithub
          aws-region: ap-southeast-1

      - name: 📦 Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Cài dependencies & build
        run: |
          npm install
          npm run build

      - name: 🚀 Upload lên S3
        run: aws s3 sync ./build s3://s3demostaticweb222 --delete

#      - name: 🔄 Xóa cache CloudFront
#        run: aws cloudfront create-invalidation --distribution-id E123456ABCDEF --paths "/*"
